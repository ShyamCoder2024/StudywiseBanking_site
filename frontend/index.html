<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/logo_new.jpg" />
  <link rel="apple-touch-icon" href="/logo_new.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="description"
    content="StudyWiseBanking - Ace your banking exams with AI-powered learning, practice tests, and personalized insights" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="StudyWise" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Preconnect for faster loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Preconnect to API for faster first request -->
  <link rel="preconnect" href="https://studywise-backend-xor3.onrender.com" crossorigin />
  <link rel="dns-prefetch" href="https://studywise-backend-xor3.onrender.com" />

  <!-- Preload critical fonts for faster text rendering -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style"
    onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  </noscript>

  <title>StudyWise Banking - Ace Your Exams</title>

  <!-- Inline critical CSS for faster First Paint -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f11;
      color: #fff;
      overflow-x: hidden;
    }

    #root {
      min-height: 100vh;
      min-height: 100dvh;
    }

    .app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f11;
      z-index: 9999;
    }

    .loader-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(138, 117, 186, 0.2);
      border-top-color: #8A75BA;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="app-loader">
      <div class="loader-spinner"></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
