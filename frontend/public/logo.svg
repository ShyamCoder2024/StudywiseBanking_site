<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8A75BA"/>
      <stop offset="100%" style="stop-color:#6EBCC3"/>
    </linearGradient>
  </defs>
  <!-- Book/Bank Icon -->
  <g transform="translate(5, 5)">
    <!-- Book base -->
    <rect x="2" y="8" width="32" height="28" rx="2" fill="url(#logoGrad)"/>
    <!-- Book spine -->
    <rect x="2" y="8" width="6" height="28" rx="1" fill="#7A66A8"/>
    <!-- Pages -->
    <rect x="10" y="12" width="20" height="2" rx="1" fill="white" opacity="0.9"/>
    <rect x="10" y="17" width="18" height="2" rx="1" fill="white" opacity="0.7"/>
    <rect x="10" y="22" width="20" height="2" rx="1" fill="white" opacity="0.9"/>
    <rect x="10" y="27" width="16" height="2" rx="1" fill="white" opacity="0.7"/>
    <!-- Bank columns overlay -->
    <rect x="12" y="30" width="3" height="6" fill="white" opacity="0.5"/>
    <rect x="17" y="30" width="3" height="6" fill="white" opacity="0.5"/>
    <rect x="22" y="30" width="3" height="6" fill="white" opacity="0.5"/>
  </g>
  <!-- Text -->
  <text x="48" y="32" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#131313">
    StudyWise<tspan fill="#8A75BA">Banking</tspan>
  </text>
</svg>
